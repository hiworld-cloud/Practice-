# Render 설정 파일 (Blueprint). Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면
# 아래 내용대로 백엔드 서버가 만들어져요. 비밀값(sync: false)은 Render 화면에서 직접 입력해요.
services:
  - type: web
    name: beautybook-api
    runtime: python
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true           # main 에 머지되면 자동으로 다시 배포
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL      # Supabase 연결 주소 (Session pooler). Render 화면에서 붙여 넣기
        sync: false
      - key: CORS_ORIGINS      # 이 API를 부를 수 있는 사이트 주소
        value: https://hiworld-cloud.github.io
      # ---- 4단계: 카카오 로그인 ----
      - key: KAKAO_REST_API_KEY  # 카카오 앱의 REST API 키. Render 화면에서 붙여 넣기
        sync: false
      - key: KAKAO_CLIENT_SECRET # 카카오 앱의 Client Secret 코드. Render 화면에서 붙여 넣기
        sync: false
      - key: KAKAO_REDIRECT_URI  # 카카오 개발자 사이트에 등록한 주소와 글자 하나까지 같아야 해요
        value: https://beautybook-api-a8o9.onrender.com/api/auth/kakao/callback
      - key: FRONTEND_URL        # 로그인 후 돌아갈 화면 주소
        value: https://hiworld-cloud.github.io/Practice-/
      - key: SECRET_KEY          # 로그인 토큰 서명용 비밀값. Render가 무작위로 만들어 줘요
        generateValue: true
